name: Code checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node tools/release-check.mjs
      - run: git diff --exit-code -- assets/app.js
# Pages continues to publish main/root. No journal data or database secrets enter Actions.
